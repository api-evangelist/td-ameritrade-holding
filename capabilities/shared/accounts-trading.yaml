naftiko: "1.0.0-alpha1"

info:
  label: "TD Ameritrade Accounts and Trading API"
  description: >-
    TD Ameritrade (now defunct, migrated to Charles Schwab) Accounts and Trading API
    for programmatic access to brokerage account information, order management, market
    data, instruments, watchlists, and trading operations. Uses OAuth 2.0 authentication.
    Historical reference only - see Charles Schwab Trader API at developer.schwab.com.
  tags:
    - TD Ameritrade
    - Finance
    - Brokerage
    - Trading
    - Market Data
    - Accounts
    - Deprecated
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TDAMERITRADE_ACCESS_TOKEN: TDAMERITRADE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: tdameritrade
      baseUri: https://api.tdameritrade.com/v1
      description: "TD Ameritrade API (deprecated)"
      authentication:
        type: bearer
        token: "{{TDAMERITRADE_ACCESS_TOKEN}}"
      resources:
        - name: accounts
          path: /accounts
          description: "Account information and balances"
          operations:
            - name: get-accounts
              method: GET
              description: "Retrieve all linked brokerage accounts"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: false
                  description: "Optional fields to include (positions, orders)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-account
              method: GET
              description: "Get account balances and positions for a specific account"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Account identifier"
                - name: fields
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: orders
          path: /accounts/{accountId}/orders
          description: "Order management"
          operations:
            - name: get-orders
              method: GET
              description: "Get orders for a specific account"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                - name: maxResults
                  in: query
                  type: integer
                  required: false
                - name: status
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: place-order
              method: POST
              description: "Place a new order for a specific account"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
              body:
                type: json
                data:
                  orderType: "{{tools.orderType}}"
                  session: "{{tools.session}}"
                  price: "{{tools.price}}"
                  duration: "{{tools.duration}}"
                  orderStrategyType: "{{tools.orderStrategyType}}"
                  orderLegCollection: "{{tools.orderLegCollection}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: cancel-order
              method: DELETE
              description: "Cancel a specific order"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                - name: orderId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: market-data
          path: /marketdata
          description: "Market quotes and price history"
          operations:
            - name: get-quote
              method: GET
              description: "Get real-time quote for a single symbol"
              inputParameters:
                - name: symbol
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-quotes
              method: GET
              description: "Get quotes for multiple symbols"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: true
                  description: "Comma-separated list of symbols"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-price-history
              method: GET
              description: "Get historical price data for a symbol"
              inputParameters:
                - name: symbol
                  in: path
                  type: string
                  required: true
                - name: periodType
                  in: query
                  type: string
                  required: false
                - name: period
                  in: query
                  type: integer
                  required: false
                - name: frequencyType
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-option-chain
              method: GET
              description: "Get option chain for an optionable symbol"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: true
                - name: contractType
                  in: query
                  type: string
                  required: false
                - name: strategy
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: instruments
          path: /instruments
          description: "Security and instrument search"
          operations:
            - name: search-instruments
              method: GET
              description: "Search for instruments by symbol or description"
              inputParameters:
                - name: symbol
                  in: query
                  type: string
                  required: true
                - name: projection
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: watchlists
          path: /accounts/{accountId}/watchlists
          description: "Watchlist management"
          operations:
            - name: get-watchlists
              method: GET
              description: "Get all watchlists for an account"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: transactions
          path: /accounts/{accountId}/transactions
          description: "Account transaction history"
          operations:
            - name: get-transactions
              method: GET
              description: "Get transaction history for an account"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                - name: type
                  in: query
                  type: string
                  required: false
                - name: startDate
                  in: query
                  type: string
                  required: false
                - name: endDate
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tdameritrade-api
      resources:
        - path: /v1/accounts
          name: accounts
          operations:
            - method: GET
              name: get-accounts
              call: "tdameritrade.get-accounts"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/quotes
          name: quotes
          operations:
            - method: GET
              name: get-quotes
              call: "tdameritrade.get-quotes"
              with:
                symbol: "rest.symbol"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tdameritrade-mcp
      transport: http
      tools:
        - name: get-accounts
          description: "Get all linked TD Ameritrade brokerage accounts"
          hints:
            readOnly: true
            openWorld: false
          call: "tdameritrade.get-accounts"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-quotes
          description: "Get real-time market quotes for one or more symbols"
          hints:
            readOnly: true
            openWorld: true
          call: "tdameritrade.get-quotes"
          with:
            symbol: "tools.symbol"
          outputParameters:
            - type: object
              mapping: "$."
