aid: td-ameritrade-holding
name: TD Ameritrade Holding
description: >-
  TD Ameritrade Holding Corporation was a brokerage firm that provided online brokerage and related services for
  individual investors. The company was acquired by Charles Schwab in 2020 and the TD Ameritrade platform was fully
  migrated to Charles Schwab in May 2024. TD Ameritrade offered a developer API for programmatic access to trading,
  account management, market data, and order management capabilities. The successor API is now the Charles Schwab Trader
  API at developer.schwab.com.
